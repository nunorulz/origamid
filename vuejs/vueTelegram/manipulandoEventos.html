<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../vue.js"></script>
    <title>F014 - Manipulando Eventos</title>

</head>
<body>
<div id="app">
    <button v-on:click="incrementar">Clique</button>
    <p>Botão clicando {{ cliques }} vezes</p>
    <p @mousemove="atualizarCoordenadas">Coordenadas x: {{x}} e y: {{y}}</p>
</div>

<script>
    const vm = new Vue({
        el: "#app",
        data: {
            cliques: 0,
            x: 0,
            y: 0,
        },
        methods: {
            incrementar(event) {
                console.log(event)
                this.cliques++
            },
            atualizarCoordenadas(event) {
                this.x = event.clientX;
                this.y = event.clientY;
            }
        }
    });
</script>
</body>
</html>
