<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <title>V-if e V-else - F035</title>
  </head>
  <body>
    <div id="app">
      <p v-if="nota === 'A'">Parabéns, você tirou um "A"</p>
      <p v-else-if="nota === 'B'">Você tirou um "B", mas pode melhorar!</p>
      <p v-else-if="nota === 'C'">Você precisa melhorar, estude mais. Sua nota foi "C"</p>
      <p v-else>Nota ainda não publicada</p>
      <input v-model="nota" placeholder="Nota" />
    </div>

    <script type="text/javascript">
      const vm = new Vue({
        el: "#app",
        data: {
          nota: ''
        }
      });
    </script>
  </body>
</html>
