<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vue Js</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

</head>
<body>
<div id="app">
    <h2>{{curso}}</h2>
</div>

<script>
    var vm = new Vue({

        data: {
            curso: "Curso de VueJs"
        },
    });

    vm.$mount("#app");

</script>
</body>
</html>
