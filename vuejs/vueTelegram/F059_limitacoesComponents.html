<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vue Js</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

</head>
<body>
<div id="app1">
    <h2>Instancia 01</h2>
    <meu-component></meu-component>
    <meu-component></meu-component>
</div>

<div id="app2"></div>

<script>

    Vue.component('meu-component',{
        template: '<h3>Meu Component</h3>',
    })

    var vm1 = new Vue({
        el: '#app1'
    });

    var vm2 = new Vue({
        el: '#app2',
        template: '<div><h2>Instancia 02</h2><meu-component></meu-component></div>',

    });

</script>
</body>
</html>
