<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <title>V-if e V-else - F034</title>
  </head>
  <body>
    <div id="app">
      <ul>
        <li>Olá VueJs</li>
        <li>Item 02</li>
        <template v-if="mostrar">
          <li>Item 03</li>
          <li>Item 04</li>
        </template>
      </ul>
    </div>

    <script type="text/javascript">
      const vm = new Vue({
        el: "#app",
        data: {
          mostrar: true,
        }
      });
    </script>
  </body>
</html>
