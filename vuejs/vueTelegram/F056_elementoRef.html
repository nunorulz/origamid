<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vue Js</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

</head>
<body>
<div id="app">
    <h2 ref="meuTitulo">{{titulo}}</h2>
    <button @click="alterarTitulo">Alterar título</button>
</div>


<script>
    var vm = new Vue({
        el: "#app",
        data: {
            titulo: "VueJs"
        },
        methods: {
            alterarTitulo(event) {
                this.titulo = 'Curso VueJs';
            }
        }
    });

    setTimeout(function () {
        vm.titulo = "Instância Vue";
    }, 5000);
</script>
</body>
</html>
