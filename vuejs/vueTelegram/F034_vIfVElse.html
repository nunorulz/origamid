<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <title>V-if e V-else - F034</title>
  </head>
  <body>
    <div id="app">
      <p v-if="mostrar">Olá VueJs</p>
      <p v-else>Até logo VueJs</p>
      <button @click="mostrar = !mostrar">Alternar</button>
    </div>

    <script type="text/javascript">
      const vm = new Vue({
        el: "#app",
        data: {
          mostrar: true,
        }
      });
    </script>
  </body>
</html>
