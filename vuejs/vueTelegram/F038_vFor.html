<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <title>V-if e V-else - F035</title>
  </head>
  <body>
    <div id="app">
      <h1>Produtos</h1>
      <ul>
        <li v-for="(produto, index) in produtos">{{texto}} - {{index}} : {{produto}}</li>
      </ul>
    </div>

    <script type="text/javascript">
      const vm = new Vue({
        el: "#app",
        data: {
          texto: 'Produto',
          produtos:[
                  'Monitor',
                  'Teclado',
                  'Mouse'
          ]
                  }
      });
    </script>
  </body>
</html>
