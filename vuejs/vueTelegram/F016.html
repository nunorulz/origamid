<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="../vue.js"></script>
    <title>F016 - Passando argumentos junto com evento</title>

</head>
<body>
<div id="app">
    <input v-on:blur="exibirNome">
    <p>{{nome}}</p>
</div>

<script>
    const vm = new Vue({
        el: "#app",
        data: {
            nome:''
        },
        methods: {
            exibirNome(event) {
                this.nome = event.target.value;
            }
        }
    });
</script>
</body>
</html>
